version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: car-sharing-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: car-sharing-app
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017/car-sharing
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  mongo-data:
